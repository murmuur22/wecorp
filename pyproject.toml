[project]
name = "wecorp-network"
version = "0.2.0"
description = "Local prototype: a file-first WE Corp website and mirrored terminal publisher"
requires-python = ">=3.11"
dependencies = ["Pillow>=11,<13", "Markdown>=3.7,<4", "bleach>=6,<7", "Jinja2>=3.1,<4", "rich>=13,<15"]

[dependency-groups]
dev = ["pytest>=8,<10", "playwright>=1.50,<2"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
